<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Webhook Action Panel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12131c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #e0e0e0;
        }
        .panel-container {
            background-color: #1e1f2b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 380px;
            min-height: 280px;
            position: relative;
        }
        
        /* --- Smooth Sliding Toggle --- */
        .toggle-container {
            display: flex;
            background-color: #151620;
            border-radius: 25px;
            padding: 5px;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
        }
        .toggle-slider {
            position: absolute;
            top: 5px;
            bottom: 5px;
            left: 0;
            background-color: #6466f1;
            border-radius: 20px;
            z-index: -1;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 2px 8px rgba(100, 102, 241, 0.4);
        }
        .toggle-btn {
            flex: 1;
            text-align: center;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            color: #8b8d99;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.3s ease;
            user-select: none;
            z-index: 2;
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }
        .toggle-btn.active {
            color: #ffffff;
        }

        /* --- Layout Sections --- */
        .layout-section {
            display: none; 
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .layout-section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Form Elements --- */
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #a0a2b0;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #252736;
            border: 1px solid #36394f;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #6466f1;
            box-shadow: 0 0 0 2px rgba(100, 102, 241, 0.2);
        }
        
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #e0e0e0;
            font-size: 15px;
            background: #252736;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #36394f;
            transition: background 0.2s ease;
        }
        .radio-label:hover { background: #2a2c3d; }
        .radio-label input {
            margin-right: 10px;
            accent-color: #6466f1;
            width: 16px;
            height: 16px;
        }

        /* --- Buttons --- */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease, opacity 0.2s ease, background-color 0.2s;
        }
        button:hover:not(:disabled) { filter: brightness(1.1); }
        button:active:not(:disabled) { transform: scale(0.98); }
        
        /* Disabled Button State */
        button:disabled {
            background-color: #2a2c3d !important;
            color: #6a6c7c !important;
            cursor: not-allowed;
            box-shadow: none !important;
            opacity: 0.7;
        }
        
        .btn-confirm { background-color: #22c55e; }
        .btn-duplicate { background-color: #3b82f6; margin-bottom: 12px;}
        .btn-delete { background-color: #ef4444; }
        .btn-cancel { background-color: #eab308; color: #1e1f2b; }

        /* --- Status Message --- */
        #message {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            display: none;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .success { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }

        /* --- Custom Modals --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #1e1f2b;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            transform: scale(0.9) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #36394f;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
        .modal-content h3 { margin: 0 0 10px 0; color: #fff; }
        .modal-content p { color: #a0a2b0; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-btn-cancel { background-color: #36394f; color: white; }
        .modal-btn-cancel:hover:not(:disabled) { background-color: #4a4d6a; }
        .modal-btn-confirm { background-color: #6466f1; }
    </style>
</head>
<body>

    <div class="panel-container">
        
        <!-- Toggle Navigation -->
        <div class="toggle-container" id="toggle-container">
            <div class="toggle-slider" id="toggle-slider"></div>
            <div class="toggle-btn active" onclick="switchLayout('confirm', this)">Confirm</div>
            <div class="toggle-btn" onclick="switchLayout('cancel', this)">Cancel</div>
            <div class="toggle-btn" onclick="switchLayout('manage', this)">Manage</div>
        </div>

        <!-- 1. Confirm Layout -->
        <div id="layout-confirm" class="layout-section active">
            <label for="balance">Balance Amount</label>
            <input type="number" id="balance" placeholder="0.00">
            
            <label for="utr">UTR Number</label>
            <input type="number" id="utr" placeholder="Enter UTR">
            
            <button class="btn-confirm" onclick="sendConfirm()">Submit Confirmation</button>
        </div>

        <!-- 2. Cancel Layout -->
        <div id="layout-cancel" class="layout-section">
            <label>Select Reason for Cancellation</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="cancelReason" value="not_a_proof" checked> 
                    Not a proof
                </label>
                <label class="radio-label">
                    <input type="radio" name="cancelReason" value="proof_spam"> 
                    Proof spam
                </label>
            </div>
            <button class="btn-cancel" onclick="sendCancel()">Process Cancellation</button>
        </div>

        <!-- 3. Manage Layout -->
        <div id="layout-manage" class="layout-section">
            <label style="margin-bottom: 15px;">Quick Actions</label>
            <button class="btn-duplicate" onclick="openModal('duplicate')">Mark as Duplicate</button>
            <button class="btn-delete" onclick="openModal('delete')">Delete Record</button>
        </div>

        <!-- Status Message (for Success/Processing) -->
        <div id="message"></div>
    </div>

    <!-- Confirmation Modal -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title">Confirm Action</h3>
            <p id="modal-desc">Are you sure you want to proceed?</p>
            <div class="modal-actions">
                <button class="modal-btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn-confirm" id="modal-confirm-btn" onclick="executePendingAction()">Yes, Proceed</button>
            </div>
        </div>
    </div>

    <!-- Alert / Error Modal -->
    <div id="alert-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="alert-title" style="color: #f87171;">Error Occurred</h3>
            <p id="alert-desc">An error has occurred.</p>
            <div class="modal-actions" style="justify-content: center;">
                <button class="modal-btn-cancel" onclick="closeAlertModal()">Dismiss</button>
            </div>
        </div>
    </div>

    <script>
        // --- Hex Decoder Logic ---
        function decode_web_url_para(web_url_para_hex) {
            let str = '';
            for (let i = 0; i < web_url_para_hex.length; i += 2) {
                str += String.fromCharCode(parseInt(web_url_para_hex.substr(i, 2), 16));
            }
            return str;
        }
        
        const web_url = new URLSearchParams(window.location.search);
        const web_url_para = web_url.get("inc") || '7b7d'; // defaults to '{}' in hex
        const jsonString = decode_web_url_para(web_url_para);
        
        // This will hold all data passed from the URL
        let user_const = JSON.parse(jsonString);
        let pendingAction = null; 

        // --- Initialization ---
        window.onload = () => {
            const activeBtn = document.querySelector('.toggle-btn.active');
            updateSliderPosition(activeBtn);
        };

        // --- UI Logic ---
        function switchLayout(layoutId, clickedBtn) {
            updateSliderPosition(clickedBtn);

            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            clickedBtn.classList.add('active');
            
            document.querySelectorAll('.layout-section').forEach(section => {
                section.classList.remove('active');
                setTimeout(() => section.style.display = 'none', 300); 
            });
            
            const targetLayout = document.getElementById('layout-' + layoutId);
            setTimeout(() => {
                targetLayout.style.display = 'block';
                void targetLayout.offsetWidth; 
                targetLayout.classList.add('active');
            }, 300);

            document.getElementById('message').style.display = 'none';
        }

        function updateSliderPosition(element) {
            const slider = document.getElementById('toggle-slider');
            slider.style.width = element.offsetWidth + 'px';
            slider.style.transform = `translateX(${element.offsetLeft}px)`;
        }

        // --- Disable Buttons feature ---
        function setButtonsState(disabled) {
            const actionButtons = document.querySelectorAll('.layout-section button, .modal-actions button');
            actionButtons.forEach(btn => {
                btn.disabled = disabled;
            });
        }

        // --- Modals Logic ---
        function openModal(actionType) {
            pendingAction = actionType;
            const modal = document.getElementById('custom-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const confirmBtn = document.getElementById('modal-confirm-btn');

            if (actionType === 'delete') {
                title.textContent = "Delete Record";
                desc.textContent = "Are you sure you want to permanently delete this record?";
                confirmBtn.style.backgroundColor = "#ef4444"; 
                confirmBtn.textContent = "Yes, Delete";
            } else if (actionType === 'duplicate') {
                title.textContent = "Mark Duplicate";
                desc.textContent = "Are you sure you want to mark this record as a duplicate?";
                confirmBtn.style.backgroundColor = "#3b82f6"; 
                confirmBtn.textContent = "Yes, Mark";
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.remove('active');
            pendingAction = null;
        }

        function closeAlertModal() {
            document.getElementById('alert-modal').classList.remove('active');
        }

        // Execute action with updated keys
        function executePendingAction() {
            // FIX: Save the action string BEFORE closing the modal!
            const actionToExecute = pendingAction; 
            
            // Now close the modal (which sets pendingAction to null)
            closeModal(); 
            
            const payload = getBasePayload();
            
            // Use the saved action string to assign the proper key
            if (actionToExecute === 'delete') {
                payload.action = "mark_deleted";
            } else if (actionToExecute === 'duplicate') {
                payload.action = "mark_duplicated";
            }
            
            sendToWebhook(payload);
        }

        // --- Payload & Request Logic ---
        function getBasePayload() {
            const { day_hook, ...payloadWithoutHook } = user_const;
            return payloadWithoutHook;
        }

        function sendConfirm() {
            const balanceVal = document.getElementById('balance').value;
            const utrVal = document.getElementById('utr').value;

            if (!balanceVal || !utrVal) {
                showMessage("Both Balance and UTR are required to submit.", "error");
                return;
            }

            const payload = getBasePayload();
            payload.balance = Number(balanceVal);
            payload.utr = Number(utrVal);
            payload.action = "confermed"; 

            sendToWebhook(payload);
        }

        function sendCancel() {
            const selectedReason = document.querySelector('input[name="cancelReason"]:checked').value;
            const payload = getBasePayload();
            payload.action = selectedReason; 
            sendToWebhook(payload);
        }

        function sendToWebhook(payload) {
            const webhookUrl = user_const.day_hook;
            if (!webhookUrl) {
                showMessage("Webhook URL (day_hook) is missing from URL data.", "error");
                return;
            }

            const messageDiv = document.getElementById('message');
            messageDiv.textContent = "Processing request...";
            messageDiv.className = "";
            messageDiv.style.display = "block";

            setButtonsState(true);

            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    messageDiv.textContent = `Success! Action sent: ${payload.action}`;
                    messageDiv.className = "success";
                    setTimeout(() => { messageDiv.style.display = "none"; }, 4000);
                } else {
                    showMessage("Server responded with error status: " + response.status, "error");
                    setButtonsState(false);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage("Failed to connect to the server. Please check your connection or console.", "error");
                setButtonsState(false);
            });
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            
            if (type === 'error') {
                messageDiv.style.display = "none";
                document.getElementById('alert-desc').textContent = text;
                document.getElementById('alert-modal').classList.add('active');
            } else {
                messageDiv.textContent = text;
                messageDiv.className = type;
                messageDiv.style.display = "block";
                
                setTimeout(() => {
                    messageDiv.style.display = "none";
                }, 4000);
            }
        }
    </script>
</body>
</html>
